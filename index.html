<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Expense Ledger</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div>
        <h1>My Expense Ledger</h1>
        <p class="subtitle">Simple daily income & expense tracker</p>
      </div>
      <button id="clearAllBtn" class="btn-outline" title="Clear all saved records">Reset Data</button>
    </header>

    <!-- Summary Cards -->
    <section class="summary-grid">
      <div class="card balance-card">
        <span class="label">Current Balance</span>
        <h2 id="totalBalance">₹0</h2>
      </div>
      <div class="card income-card">
        <span class="label">Total Income</span>
        <h2 id="totalIncome">+₹0</h2>
      </div>
      <div class="card expense-card">
        <span class="label">Total Expense</span>
        <h2 id="totalExpense">-₹0</h2>
      </div>
    </section>

    <main class="main-grid">
      <!-- Left Side: Form + Spending Breakdown -->
      <div class="left-column">
        <section class="card">
          <h3>Add New Entry</h3>
          <form id="transactionForm">
            <div class="form-group">
              <label for="title">Description</label>
              <input type="text" id="title" placeholder="e.g. Grocery, Salary, Chai" required />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input type="number" id="amount" placeholder="500" min="1" step="any" required />
              </div>

              <div class="form-group">
                <label for="type">Type</label>
                <select id="type">
                  <option value="expense">Expense (-)</option>
                  <option value="income">Income (+)</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                  <option value="Food">Food & Dining</option>
                  <option value="Bills">Bills & Rent</option>
                  <option value="Travel">Travel & Fuel</option>
                  <option value="Shopping">Shopping</option>
                  <option value="Salary">Salary / Freelance</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required />
              </div>
            </div>

            <button type="submit" class="btn-primary">Save Entry</button>
          </form>
        </section>

        <!-- Data Visualization: Category Bars -->
        <section class="card chart-section">
          <div class="section-head">
            <h3>Expense Breakdown</h3>
            <span class="badge" id="expenseCount">0 expenses</span>
          </div>
          <div id="chartContainer" class="chart-list">
            <p class="empty-msg">Add some expenses to see category breakdown.</p>
          </div>
        </section>
      </div>

      <!-- Right Side: History List -->
      <section class="card history-section">
        <div class="section-head">
          <h3>Recent Transactions</h3>
          <select id="filterType" class="filter-select">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expenses</option>
          </select>
        </div>

        <ul id="transactionList" class="transaction-list">
          <li class="empty-msg">No transactions recorded yet.</li>
        </ul>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
